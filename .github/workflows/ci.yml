# Compila la solución y corre todos los tests en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar paquetes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Tests (con medición de cobertura)
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./resultados-tests

      # Informe de cobertura: qué porcentaje del código ejecutan los tests.
      # Se muestra en el resumen de cada ejecución del CI y se guarda como archivo descargable.
      - name: Informe de cobertura
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./resultados-tests/**/coverage.cobertura.xml" \
            -targetdir:./cobertura \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -assemblyfilters:"+PrevisionAR.Motor;+PrevisionAR.Web"
          cat ./cobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: ./cobertura
