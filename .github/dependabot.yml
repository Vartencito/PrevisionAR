# Revisa una vez por mes si hay versiones nuevas de paquetes NuGet y de las acciones de GitHub.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
